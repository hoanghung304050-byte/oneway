{% extends 'core/home.html' %}
{% block title %}Đăng Ký{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4>Đăng Ký Tài Khoản Mới</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <small class="text-danger">{{ field.errors.0 }}</small>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-success w-100 fw-bold">Tạo Tài Khoản</button>
                    <div class="text-center mt-3">
                        Đã có tài khoản? <a href="{% url 'login' %}" class="text-decoration-none">Đăng nhập</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
