{% extends 'core/home.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <i class="fa-solid fa-envelope-open-text fa-3x text-primary mb-3"></i>
                    <h3 class="fw-bold">XÁC MINH EMAIL</h3>
                    <p class="text-muted small">Chúng tôi đã gửi mã 6 số đến email của ngài. Vui lòng kiểm tra hộp thư (cả mục Spam).</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold rounded-pill" 
                                   placeholder="0 0 0 0 0 0" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">HOÀN TẤT ĐĂNG KÝ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
