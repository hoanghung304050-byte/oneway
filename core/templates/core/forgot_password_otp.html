{% extends 'core/home.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0 rounded-4" style="width: 400px;">
        <div class="card-header bg-dark text-white text-center py-3" style="border-radius: 20px 20px 0 0;">
            <h5 class="mb-0 fw-bold">QUÊN MẬT KHẨU</h5>
        </div>
        <div class="card-body p-4">
            <p class="small text-muted text-center mb-4">Nhập email của ngài để nhận mã OTP khôi phục.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small"><i class="fa-solid fa-envelope me-2 text-primary"></i>Email của ngài</label>
                    <input type="email" name="email" class="form-control rounded-pill px-3" placeholder="email@oneway.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold shadow">GỬI MÃ XÁC THỰC</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
