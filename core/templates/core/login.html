{% extends 'core/home.html' %}
{% block header %}{% endblock %} {% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <h3 class="fw-bold mb-0 text-uppercase">Đăng Nhập Hệ Thống</h3>
                    <small class="text-warning">Chào mừng đại vương trở lại</small>
                </div>

                <div class="card-body p-5 bg-white">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
                                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="fw-bold mb-1"><i class="fa-solid fa-user me-2 text-primary"></i>Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control rounded-pill px-4" placeholder="Nhập username của ngài" required>
                        </div>

                        <div class="mb-4">
                            <label class="fw-bold mb-1"><i class="fa-solid fa-lock me-2 text-primary"></i>Mật khẩu</label>
                            <input type="password" name="password" class="form-control rounded-pill px-4" placeholder="********" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm mb-3">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP NGAY
                        </button>

                        <div class="text-center">
                            <span class="small text-muted">Chưa có tài khoản?</span>
                            <a href="{% url 'register' %}" class="small fw-bold text-decoration-none text-primary">Đăng ký ngay tại đây</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
