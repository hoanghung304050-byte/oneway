{% extends 'core/home.html' %}

{% block title %}Sửa Sản Phẩm - ONEWAY{% endblock %}

{% block extra_css %}
<style>
    .admin-card { border-radius: 15px; border: none; }
    .preview-box {
        width: 100%; height: 120px; border: 2px dashed #ddd;
        border-radius: 10px; display: flex; align-items: center;
        justify-content: center; background: #fff; overflow: hidden;
    }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .section-divider { border-top: 1px solid #eee; margin: 2rem 0; position: relative; }
    .section-divider span { 
        position: absolute; top: -12px; left: 20px; 
        background: #f8f9fa; padding: 0 10px; 
        font-weight: bold; color: #0d6efd; text-transform: uppercase; font-size: 12px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="card admin-card shadow-lg">
        <div class="card-header bg-dark text-white py-3 rounded-top-4">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>CẬP NHẬT: {{ product.name }}</h5>
        </div>
        <div class="card-body p-4 bg-light">
            <form method="POST">
                {% csrf_token %}
                
                <div class="row mb-4">
                    <div class="col-md-8">
                        <label class="fw-bold mb-1">Tên sản phẩm</label>
                        <input type="text" name="name" class="form-control rounded-3" value="{{ product.name }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold mb-1">Giá bán (₫)</label>
                        <input type="text" name="price" class="form-control rounded-3 fw-bold text-danger" value="{{ product.price }}">
                    </div>
                </div>

                <div class="section-divider"><span>Bộ sưu tập ảnh sản phẩm</span></div>
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="small fw-bold text-primary">Ảnh bìa chính (URL):</label>
                        <input type="text" name="image_url" id="url_1" class="form-control form-control-sm mb-2" value="{{ product.image_url }}" oninput="updatePreview(1)">
                        <div class="preview-box"><img id="pre_1" src="{{ product.image_url|default:'https://via.placeholder.com/150' }}"></div>
                    </div>

                    <div class="col-md-8">
                        <div class="row g-2">
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 2:</label>
                                <input type="text" name="image_url_2" id="url_2" class="form-control form-control-sm mb-2" value="{{ product.image_url_2|default:'' }}" oninput="updatePreview(2)">
                                <div class="preview-box" style="height: 80px;"><img id="pre_2" src="{{ product.image_url_2|default:'https://via.placeholder.com/150' }}"></div>
                            </div>
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 3:</label>
                                <input type="text" name="image_url_3" id="url_3" class="form-control form-control-sm mb-2" value="{{ product.image_url_3|default:'' }}" oninput="updatePreview(3)">
                                <div class="preview-box" style="height: 80px;"><img id="pre_3" src="{{ product.image_url_3|default:'https://via.placeholder.com/150' }}"></div>
                            </div>
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 4:</label>
                                <input type="text" name="image_url_4" id="url_4" class="form-control form-control-sm mb-2" value="{{ product.image_url_4|default:'' }}" oninput="updatePreview(4)">
                                <div class="preview-box" style="height: 80px;"><img id="pre_4" src="{{ product.image_url_4|default:'https://via.placeholder.com/150' }}"></div>
                            </div>
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 5:</label>
                                <input type="text" name="image_url_5" id="url_5" class="form-control form-control-sm mb-2" value="{{ product.image_url_5|default:'' }}" oninput="updatePreview(5)">
                                <div class="preview-box" style="height: 80px;"><img id="pre_5" src="{{ product.image_url_5|default:'https://via.placeholder.com/150' }}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-divider"><span>Nội dung mô tả chi tiết</span></div>
                
                <div class="row">
                    <div class="col-md-7">
                        <label class="fw-bold small mb-1">Văn bản mô tả:</label>
                        <textarea name="description" class="form-control rounded-3" rows="12">{{ product.description }}</textarea>
                    </div>
                    <div class="col-md-5">
                        <label class="fw-bold small mb-1 text-danger">Ảnh minh họa trong mô tả (URL):</label>
                        <input type="text" name="desc_image_url" id="url_desc" class="form-control mb-2" value="{{ product.desc_image_url|default:'' }}" oninput="updatePreview('desc')">
                        <div class="preview-box" style="height: 250px; border-color: #ffc107;">
                            <img id="pre_desc" src="{{ product.desc_image_url|default:'https://via.placeholder.com/300x200?text=Mo+ta+hinh+anh' }}">
                        </div>
                    </div>
                </div>

                <div class="mt-5 pt-3 border-top d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold px-5 rounded-pill shadow">LƯU DỮ LIỆU</button>
                    <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-outline-secondary btn-lg px-4 rounded-pill text-decoration-none">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function updatePreview(id) {
        const val = document.getElementById('url_' + id).value;
        const img = document.getElementById('pre_' + id);
        img.src = val ? val : "https://via.placeholder.com/150?text=No+Image";
    }
</script>
{% endblock %}
