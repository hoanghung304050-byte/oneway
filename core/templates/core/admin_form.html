{% extends 'core/home.html' %}

{% block title %}Sửa Sản Phẩm - ONEWAY{% endblock %}

{% block extra_css %}
<style>
    .admin-card { border-radius: 15px; border: none; }
    .preview-box {
        width: 100%; height: 120px; border: 2px dashed #ddd;
        border-radius: 10px; display: flex; align-items: center;
        justify-content: center; background: #fff; overflow: hidden;
    }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .section-divider { border-top: 1px solid #eee; margin: 2rem 0; position: relative; }
    .section-divider span { 
        position: absolute; top: -12px; left: 20px; 
        background: #f8f9fa; padding: 0 10px; 
        font-weight: bold; color: #0d6efd; text-transform: uppercase; font-size: 12px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="card admin-card shadow-lg">
        <div class="card-header bg-dark text-white py-3 rounded-top-4">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>CẬP NHẬT: {{ product.name }}</h5>
        </div>
        <div class="card-body p-4 bg-light">
        <form method="POST" enctype="multipart/form-data"> {% csrf_token %}
                
                <div class="row mb-4">
                    <div class="col-md-8">
                        <label class="fw-bold mb-1">Tên sản phẩm</label>
                        <input type="text" name="name" class="form-control rounded-3" value="{{ product.name }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold mb-1">Giá bán (₫)</label>
                        <input type="text" name="price" class="form-control rounded-3 fw-bold text-danger" value="{{ product.price }}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold text-primary">Loại sản phẩm</label>
                        <select name="category" class="form-select">
                            <option value="phone" {% if product.category == 'phone' %}selected{% endif %}>Điện thoại, Tablet</option>
                            <option value="laptop" {% if product.category == 'laptop' %}selected{% endif %}>Laptop, Macbook</option>
                            <option value="ipad" {% if product.category == 'ipad' %}selected{% endif %}>iPad, Máy tính bảng</option>
                            <option value="am-thanh" {% if product.category == 'am-thanh' %}selected{% endif %}>Âm thanh, Tai nghe</option>
                            <option value="phu-kien" {% if product.category == 'phu-kien' %}selected{% endif %}>Phụ kiện công nghệ</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold text-primary">Thương hiệu</label>
                        <input type="text" name="brand" class="form-control" placeholder="VD: Apple, Samsung..." value="{{ product.brand|default:'' }}">
                    </div>
                </div>

                <div class="section-divider"><span>Bộ sưu tập ảnh sản phẩm</span></div>
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="small fw-bold text-primary">Ảnh bìa chính:</label>
                        <input type="file" name="image" id="url_1" class="form-control form-control-sm mb-2" onchange="updatePreview(event, 1)">
                        <div class="preview-box">
                            <img id="pre_1" src="{% if product.image %}{{ product.image.url }}{% else %}https://via.placeholder.com/150{% endif %}">
                        </div>
                    </div>

                    <div class="col-md-8">
                        <div class="row g-2">
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 2:</label>
                                <input type="file" name="image_2" id="url_2" class="form-control form-control-sm mb-2" onchange="updatePreview(event, 2)">
                                <div class="preview-box" style="height: 80px;">
                                    <img id="pre_2" src="{% if product.image_2 %}{{ product.image_2.url }}{% else %}https://via.placeholder.com/150{% endif %}">
                                </div>
                            </div>
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 3:</label>
                                <input type="file" name="image_3" id="url_3" class="form-control form-control-sm mb-2" onchange="updatePreview(event, 3)">
                                <div class="preview-box" style="height: 80px;">
                                    <img id="pre_3" src="{% if product.image_3 %}{{ product.image_3.url }}{% else %}https://via.placeholder.com/150{% endif %}">
                                </div>
                            </div>
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 4:</label>
                                <input type="file" name="image_4" id="url_4" class="form-control form-control-sm mb-2" onchange="updatePreview(event, 4)">
                                <div class="preview-box" style="height: 80px;">
                                    <img id="pre_4" src="{% if product.image_4 %}{{ product.image_4.url }}{% else %}https://via.placeholder.com/150{% endif %}">
                                </div>
                            </div>
                            <div class="col-3">
                                <label class="small fw-bold">Ảnh 5:</label>
                                <input type="file" name="image_5" id="url_5" class="form-control form-control-sm mb-2" onchange="updatePreview(event, 5)">
                                <div class="preview-box" style="height: 80px;">
                                    <img id="pre_5" src="{% if product.image_5 %}{{ product.image_5.url }}{% else %}https://via.placeholder.com/150{% endif %}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-divider"><span>Nội dung mô tả chi tiết</span></div>
                
                <div class="row">
                    <div class="col-md-7">
                        <label class="fw-bold small mb-1">Văn bản mô tả:</label>
                        <textarea name="description" class="form-control rounded-3" rows="12">{{ product.description }}</textarea>
                    </div>
                    <div class="col-md-5">
                        <label class="fw-bold small mb-1 text-danger">Ảnh minh họa trong mô tả:</label>
                        <input type="file" name="desc_image" id="url_desc" class="form-control mb-2" onchange="updatePreview(event, 'desc')">
                        <div class="preview-box" style="height: 250px; border-color: #ffc107;">
                            <img id="pre_desc" src="{% if product.desc_image %}{{ product.desc_image.url }}{% else %}https://via.placeholder.com/300x200?text=Mo+ta+hinh+anh{% endif %}">
                        </div>
                    </div>
                </div>

                <div class="mt-5 pt-3 border-top d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold px-5 rounded-pill shadow">LƯU DỮ LIỆU</button>
                    <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-outline-secondary btn-lg px-4 rounded-pill text-decoration-none">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Hàm cập nhật Preview thông minh cho File Upload
    function updatePreview(event, id) {
        const file = event.target.files[0];
        const img = document.getElementById('pre_' + id);
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        } else {
            // Nếu không có file (người dùng bấm hủy chọn), trẫm sẽ giữ nguyên ảnh cũ 
            // hoặc hiện placeholder tùy ý đại vương
        }
    }
</script>
{% endblock %}
