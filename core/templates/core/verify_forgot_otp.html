{% extends 'core/home.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0 rounded-4" style="width: 400px;">
        <div class="card-body p-4 text-center">
            <div class="text-primary mb-3">
                <i class="fa-solid fa-shield-halved fa-3x"></i>
            </div>
            <h5 class="fw-bold mb-3">XÁC THỰC OTP</h5>
            <p class="small text-muted mb-4"> mã OTP đã được gửi.Bạn hãy kiểm tra hộp thư nhé.</p>
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold rounded-4 mb-3" maxlength="6" placeholder="000000" required>
                <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold shadow">XÁC NHẬN MÃ</button>
            </form>
            <div class="mt-3">
                <a href="{% url 'forgot_password_otp' %}" class="small text-decoration-none text-muted">Gửi lại mã khác?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
